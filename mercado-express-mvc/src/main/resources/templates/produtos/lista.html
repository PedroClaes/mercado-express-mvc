<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos · Mercado Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Barra superior -->
<header class="topbar">
    <a class="brand" th:href="@{/produtos}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Mercado<span>Express</span>
    </a>
    <div class="topbar-right">
        <!-- Quando logado -->
        <div class="user-chip" sec:authorize="isAuthenticated()">
            <span>Olá, <strong sec:authentication="name">usuário</strong></span>
        </div>
        <form th:action="@{/logout}" method="post" class="inline-form" sec:authorize="isAuthenticated()">
            <button type="submit" class="btn btn-ghost btn-sm">Sair</button>
        </form>
        <!-- Quando visitante -->
        <a th:href="@{/login}" class="btn btn-outline btn-sm" sec:authorize="!isAuthenticated()">Entrar</a>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Produtos</h1>
            <p>Catálogo do mercado express</p>
        </div>
        <!-- Botao so aparece para ADMIN -->
        <a th:href="@{/produtos/novo}" class="btn btn-brand" sec:authorize="hasRole('ADMIN')">
            + Novo produto
        </a>
    </div>

    <div class="card">
        <!-- Estado vazio -->
        <div class="empty" th:if="${#lists.isEmpty(produtos)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 3h2l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <p>Nenhum produto cadastrado ainda.</p>
        </div>

        <!-- Tabela -->
        <table th:unless="${#lists.isEmpty(produtos)}">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Setor</th>
                <th>Tamanho</th>
                <th>Preço</th>
                <th sec:authorize="hasRole('ADMIN')" style="text-align:right">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td class="produto-nome" th:text="${p.nome}">Nome</td>
                <td><span class="badge" th:text="${p.tipo}">Tipo</span></td>
                <td th:text="${p.setor}">Setor</td>
                <td th:text="${p.tamanho}">Tamanho</td>
                <td class="preco" th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                <td sec:authorize="hasRole('ADMIN')">
                    <div class="acoes">
                        <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-outline btn-sm">Editar</a>
                        <form th:action="@{/produtos/deletar/{id}(id=${p.id})}" method="post" class="inline-form"
                              onsubmit="return confirm('Excluir este produto?');">
                            <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
