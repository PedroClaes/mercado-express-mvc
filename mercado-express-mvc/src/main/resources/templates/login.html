<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Mercado Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-head">
            <a class="brand" th:href="@{/produtos}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Mercado<span>Express</span>
            </a>
            <p>Entre para gerenciar os produtos</p>
        </div>

        <div class="card">
            <!-- Mensagens -->
            <div class="alert alert-error" th:if="${param.error}">
                Usuário ou senha inválidos.
            </div>
            <div class="alert alert-ok" th:if="${param.logout}">
                Você saiu com sucesso.
            </div>

            <!-- POST /login e processado pelo Spring Security -->
            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" autofocus placeholder="admin">
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-brand" style="width:100%; justify-content:center;">Entrar</button>
                </div>
            </form>

            <p class="hint">Teste: <strong>admin / admin123</strong> (acesso total)</p>
        </div>
    </div>
</div>

</body>
</html>
