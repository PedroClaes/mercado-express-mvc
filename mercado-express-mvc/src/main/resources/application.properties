spring.application.name=mercado-express-mvc

# ============================================================
# Servidor - porta 8080 local; no deploy a plataforma injeta PORT
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Banco de Dados - mesmo Oracle da Parte I, tabela TDS_MVC_TB_MERCADO
# ============================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:RM566058}
spring.datasource.password=${DB_PASSWORD:221106}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ============================================================
# Thymeleaf - desliga cache em desenvolvimento (ve as mudancas na hora)
# ============================================================
spring.thymeleaf.cache=false
